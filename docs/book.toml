[book]
title = "sciencekit for R"
description = "R bindings (sciencekitr) for the sciencekit machine-learning library — registered .Call routines, external-pointer handles, strict f64 dense matrices, structured conditions, and model persistence over the stable sciencekit_ffi C ABI."
authors = ["sciencekit project"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
mathjax-support = true
theme = "theme"
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/custom.css"]
additional-js = [
    "theme/mermaid.min.js",
    "theme/mermaid-init.js",
    "theme/custom.js",
]
git-repository-url = "https://github.com/neurono-ml/sciencekit-r"
edit-url-template = "https://github.com/neurono-ml/sciencekit-r/edit/docs/documentations/docs/{path}"
site-url = "/sciencekit-r/"
no-section-label = true

[output.html.search]
enable = true
boost-title = 2

[output.html.playground]
editable = false
line-numbers = true
copyable = true
